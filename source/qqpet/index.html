<!DOCTYPE html>
<html lang=zh-CN>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<meta name=theme-color content=#f7f7f3>

<head>
    <title>刘猫猫主页</title>
    <style>
        .column-left,
        .column-right,
        .column-right-shadow {
            display: none !important
        }

        .column-main {
            flex: none !important;
            max-width: 100% !important;
            width: 100% !important
        }
    </style>
<body>
    <style>
        :root {
            color-scheme: light;
            --blue: #009ff0;
            --paper: #f7f7f3
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-width: 320px;
            min-height: 100%
        }

        body {
            background: var(--paper);
            color: #161918;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif
        }

        .page {
            min-height: 100dvh;
            position: relative;
            overflow: hidden;
            isolation: isolate
        }

        .page::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .18;
            background: radial-gradient(#a8a89f .55px, transparent .65px);
            background-size: 9px 11px
        }

        .page::after {
            content: "";
            position: absolute;
            width: 65vw;
            height: 65vw;
            top: -30vw;
            right: -25vw;
            z-index: -1;
            border-radius: 50%;
            background: radial-gradient(circle, #e6edf0, transparent 65%);
            opacity: .45
        }
        .full-screen {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 11;
            width: 100vw;
            height: 100svh;
            background-color: #fff;
        }
        #qqpet-frame{
            position: relative;
            top: calc(var(--nav-height) + 1em);
            width: 100%;
            height: calc(100% - var(--nav-height) - 1em);
        }
    </style>
    <main class="page playing full-screen">
        <div class="body-bg-container"><div class="bg1"></div><div class="bg2"></div></div>
        <iframe id="qqpet-frame" title="QQ-Pet"
            src="/home/qqpet-out/index.html">
        </iframe>
    </main>
    <script>
        const cardElements = document.querySelectorAll('.card');
        cardElements.forEach(el => {
            el.classList.remove('card');
        });
    </script>
</body>
