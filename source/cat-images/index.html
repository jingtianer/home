<!DOCTYPE html>
<html lang=zh-CN>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<meta name=theme-color content=#f7f7f3>

<head>
    <title>刘猫猫主页</title>
    <style>
        .column-left,
        .column-right,
        .column-right-shadow {
            display: none !important
        }

        .column-main {
            flex: none !important;
            max-width: 100% !important;
            width: 100% !important
        }
    </style>
<body>
    <style>
        :root {
            color-scheme: light;
            --blue: #009ff0;
            --paper: #f7f7f3
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-width: 320px;
            min-height: 100%
        }

        body {
            background: var(--paper);
            color: #161918;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif
        }

        .page {
            min-height: 100svh;
            position: relative;
            overflow: hidden;
            isolation: isolate
        }

        .page::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .18;
            background: radial-gradient(#a8a89f .55px, transparent .65px);
            background-size: 9px 11px
        }

        .page::after {
            content: "";
            position: absolute;
            width: 65vw;
            height: 65vw;
            top: -30vw;
            right: -25vw;
            z-index: -1;
            border-radius: 50%;
            background: radial-gradient(circle, #e6edf0, transparent 65%);
            opacity: .45
        }

        .gallery {
            position: absolute;
            top: 19%;
            left: 50%;
            width: min(1120px, 88vw);
            aspect-ratio: 2.5;
            transform: translateX(-50%)
        }

        .shot {
            position: absolute;
            margin: 0;
            width: var(--w);
            height: var(--h);
            left: var(--x);
            top: var(--y);
            z-index: var(--z);
            opacity: var(--opacity, 1);
            transform: rotate(var(--r));
            scale: 1;
            transition: scale 0.2s ease;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, .8);
            background: rgba(255, 255, 255, .43);
            box-shadow: 0 18px 35px -17px rgba(40, 34, 17, .3), 0 1px 2px rgba(255, 255, 255, .8) inset;
            backdrop-filter: blur(12px);
        }

        .shot:hover {
            z-index: 999;
            --shot-opacity: 1;
            scale: 1.08;
            opacity: 1;
        }

        .shot img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: var(--focus, 50% 50%)
        }

        .wave {
            --x: 0%;
            --y: 28%;
            --w: 22%;
            --h: 52%;
            --r: -9deg;
            --z: 2;
            --opacity: .72;
            --focus: 79% 68%
        }

        .crystal {
            --x: 17%;
            --y: 11%;
            --w: 18%;
            --h: 78%;
            --r: -5deg;
            --z: 4;
            --focus: 58% 28%
        }

        .starry {
            --x: 30%;
            --y: -7%;
            --w: 32%;
            --h: 63%;
            --r: 4deg;
            --z: 3;
            --opacity: .86;
            --focus: 66% 38%
        }

        .portrait {
            --x: 40%;
            --y: 14%;
            --w: 23%;
            --h: 88%;
            --r: -2deg;
            --z: 8;
            --focus: 50% 43%
        }

        .scream {
            --x: 60%;
            --y: 24%;
            --w: 19%;
            --h: 78%;
            --r: 7deg;
            --z: 6;
            --focus: 50% 38%
        }

        .bust {
            --x: 76%;
            --y: 4%;
            --w: 17%;
            --h: 78%;
            --r: 9deg;
            --z: 5;
            --opacity: .84;
            --focus: 50% 35%
        }

        .academy {
            --x: 80%;
            --y: 61%;
            --w: 25%;
            --h: 43%;
            --r: -5deg;
            --z: 7;
            --opacity: .84;
            --focus: 50% 59%
        }

        .echo {
            position: absolute;
            left: 34%;
            top: -17%;
            width: 26%;
            height: 101%;
            object-fit: cover;
            opacity: .075;
            filter: blur(1.5px);
            transform: rotate(-13deg);
            z-index: 0;
            mask-image: linear-gradient(transparent, black 18%, black 75%, transparent)
        }

        .glass {
            position: absolute;
            left: 9%;
            top: 44%;
            width: 80%;
            height: 20%;
            z-index: 9;
            pointer-events: none;
            opacity: .45;
            border: 1px solid rgba(255, 255, 255, .38);
            background: linear-gradient(110deg, transparent, rgba(255, 255, 255, .12), transparent);
            backdrop-filter: blur(.6px);
            transform: rotate(-3deg)
        }

        .entry {
            position: absolute;
            left: max(8vw, calc((100vw - 1240px)/2));
            bottom: 16%;
            z-index: 12;
            display: inline-flex;
            align-items: center;
            gap: .35em;
            color: #161918;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            font-size: clamp(32px, 4.4vw, 63px);
            line-height: 1.3;
            font-weight: 600;
            letter-spacing: -.035em;
            text-decoration: none
        }

        .arrow {
            color: var(--blue);
            font-family: Georgia, serif;
            font-weight: 400;
            transition: transform .22s
        }

        .entry:hover .arrow {
            transform: translateX(10px)
        }

        .entry:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 12px
        }

        .progress {
            position: absolute;
            left: max(8vw, calc((100vw - 1240px)/2));
            bottom: calc(16% - 24px);
            width: 76px;
            height: 2px;
            background: #dcdedb
        }

        .progress span {
            display: block;
            width: 100%;
            height: 100%;
            background: var(--blue);
            transform-origin: left
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap
        }

        .wave {
            --dx: -61vw;
            --dy: -19vh;
            --turn: -26deg
        }

        .crystal {
            --dx: -38vw;
            --dy: 38vh;
            --turn: -19deg
        }

        .starry {
            --dx: -15vw;
            --dy: -65vh;
            --turn: 15deg
        }

        .portrait {
            --dx: -10vw;
            --dy: 73vh;
            --turn: -12deg
        }

        .scream {
            --dx: 36vw;
            --dy: 43vh;
            --turn: 26deg
        }

        .bust {
            --dx: 43vw;
            --dy: -48vh;
            --turn: 23deg
        }

        .academy {
            --dx: 63vw;
            --dy: 21vh;
            --turn: -16deg
        }

        .playing .shot {
            opacity: 0;
            transform: translate(var(--dx), var(--dy)) rotate(var(--turn)) scale(.85);
            animation: gather 1.05s 1.35s cubic-bezier(.16, 1, .3, 1) forwards
        }

        .playing .echo,
        .playing .glass {
            opacity: 0;
            animation: fade-in .5s 1.55s forwards
        }

        .playing .echo {
            --enter-opacity: .075
        }

        .playing .glass {
            --enter-opacity: .45
        }

        .playing .entry,
        .playing .progress {
            --enter-opacity: 1;
            opacity: 0;
            animation: fade-in .45s 1.75s forwards
        }

        .full-screen {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 11;
            width: 100vw;
            height: 100svh;
            background-color: #fff;
        }

        .place-holder {
            position: relative;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100svh;
        }

        .portal {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 11;
            width: 100vw;
            height: 100svh;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .85);
            border-radius: 0;
            background: #faf9f6;
            box-shadow: none;
            translate: -50% -50%;
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: none;
            filter: blur(0)
        }

        .playing .portal {
            animation: portal-collapse .5s .2s cubic-bezier(.45, 0, .2, 1) forwards, portal-sink .8s .75s cubic-bezier(.45, 0, .15, 1) forwards
        }

        .browser-bar {
            height: 43px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 18px;
            border-bottom: 1px solid #e5e4df;
            background: rgba(255, 255, 255, .8)
        }

        .browser-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c6c8c6
        }

        .address {
            margin: 0 auto;
            padding-right: 32px;
            color: #848782;
            font: 11px Consolas, monospace;
            letter-spacing: .025em
        }

        .destination-surface {
            height: calc(100% - 43px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden
        }

        .destination-surface::before,
        .destination-surface::after {
            content: "";
            position: absolute;
            width: 75%;
            aspect-ratio: 1;
            border: 1px solid rgba(136, 41, 49, .06);
            border-radius: 50%;
            pointer-events: none
        }

        .destination-surface::before {
            left: -47%;
            bottom: -105%;
            box-shadow: 0 0 0 38px rgba(136, 41, 49, .025), 0 0 0 76px rgba(136, 41, 49, .018)
        }

        .destination-surface::after {
            right: -47%;
            top: -105%
        }

        .neu-name {
            margin: 0;
            color: #8d2936;
            font: 600 clamp(36px, 6vw, 82px)/1.3"Songti SC", "SimSun", serif;
            letter-spacing: .17em;
            text-indent: .17em
        }

        .neu-english {
            margin: 12px 0 0;
            color: #8d2936;
            font: 10px Georgia, serif;
            letter-spacing: .26em
        }

        .neu-loading {
            width: 38px;
            height: 1px;
            margin-top: 29px;
            overflow: hidden;
            background: #e4d7d7
        }

        .neu-loading::after {
            content: "";
            display: block;
            height: 100%;
            width: 50%;
            background: #8d2936;
            animation: loading 1s ease-in-out infinite
        }

        .replay {
            position: fixed;
            right: 24px;
            bottom: 22px;
            z-index: 30;
            padding: 10px 15px;
            border: 1px solid #dddeda;
            border-radius: 30px;
            background: rgba(255, 255, 255, .85);
            color: #68716c;
            font: 12px"Microsoft YaHei", sans-serif;
            cursor: pointer
        }

        .replay:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px
        }

        @keyframes scatter {
            0% {
                opacity: var(--opacity, 1);
                transform: translate(0, 0) rotate(var(--r)) scale(1)
            }

            35% {
                opacity: var(--opacity, 1)
            }

            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) rotate(var(--turn)) scale(.85)
            }
        }

        @keyframes fade-away {
            to {
                opacity: 0;
                visibility: hidden
            }
        }

        @keyframes fade-in {
            to {
                opacity: var(--enter-opacity, var(--opacity, 1))
            }
        }

        @keyframes gather {
            0% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) rotate(var(--turn)) scale(.85)
            }

            65% {
                opacity: var(--shot-opacity, var(--opacity, 1))
            }

            100% {
                opacity: var(--shot-opacity, var(--opacity, 1));
                transform: translate(0, 0) rotate(var(--r)) scale(1)
            }
        }

        @keyframes portal-rise {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0)
            }
        }

        @keyframes portal-expand {
            to {
                top: 50%;
                width: 100vw;
                height: 100svh;
                border-radius: 0;
                box-shadow: none
            }
        }

        @keyframes portal-collapse {
            to {
                top: 43%;
                width: min(760px, 82vw);
                height: min(440px, 58svh);
                border-radius: 14px;
                box-shadow: 0 30px 100px rgba(34, 35, 35, .18)
            }
        }

        @keyframes portal-sink {
            to {
                opacity: 0;
                transform: translateY(80px) scale(.54);
                filter: blur(9px);
                visibility: hidden
            }
        }

        @keyframes loading {
            from {
                transform: translateX(-110%)
            }

            to {
                transform: translateX(210%)
            }
        }

        @keyframes arrive {
            from {
                opacity: 0;
                translate: 0 18px
            }

            to {
                opacity: var(--opacity, 1);
                translate: 0 0
            }
        }

        @media (max-width:700px) {
            .gallery {
                width: 156vw;
                top: 23%;
                aspect-ratio: 2.15
            }

            .entry {
                left: 7vw;
                bottom: 20%;
                font-size: clamp(29px, 6.7vw, 44px);
                gap: .22em
            }

            .progress {
                left: 7vw;
                bottom: calc(20% - 22px);
                width: 58px
            }

            .shot {
                padding: 3px;
            }

            .portrait {
                --x: 39%;
                --w: 24%
            }

            .wave,
            .academy {
                opacity: .48
            }
        }

        @media (max-height:580px) and (min-width:701px) {
            .gallery {
                top: 7%;
                width: min(850px, 76vw)
            }

            .entry {
                bottom: 10%;
                font-size: 36px
            }

            .progress {
                bottom: calc(10% - 16px)
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .arrow {
                transition: none
            }

            .playing .shot {
                transform: translate(0, 0) rotate(var(--r)) scale(1);
                animation: fade-in .3s 1.35s forwards
            }

            .portal {
                transform: none;
                filter: none
            }

            .playing .portal {
                animation: fade-away .3s .65s forwards
            }

            .neu-loading::after {
                animation: none
            }
        }

        .sf-hidden {
            display: none !important
        }
    </style>
    <main class="page playing full-screen">
        <div class="body-bg-container"><div class="bg1"></div><div class="bg2"></div></div>
        <div class=gallery aria-label=刘猫猫馆藏图片层叠>
            <figure class="shot wave"><img src="/home/cat-images/lmm/1.jpg" loading="eager"/></figure>
            <figure class="shot crystal"><img src="/home/cat-images/lmm/2.jpg" loading="eager"/></figure>
            <figure class="shot starry"><img src="/home/cat-images/lmm/3.jpg" loading="eager"/></figure>
            <figure class="shot portrait"><img src="/home/cat-images/lmm/4.jpg" loading="eager"/></figure>
            <figure class="shot scream"><img src="/home/cat-images/lmm/5.jpg" loading="eager"/></figure>
            <figure class="shot bust"><img src="/home/cat-images/lmm/6.jpg" loading="eager"/></figure>
            <figure class="shot academy"><img src="/home/cat-images/lmm/7.jpg" loading="eager"/></figure>
            <div class=glass aria-hidden=true></div>
        </div>
        <a class="entry is-active" href="/home/" aria-label=前往刘猫猫主页>前往刘猫猫主页<span class=arrow
                aria-hidden=true>→</span></a>
        <div class=progress aria-hidden=true><span id=progress style=transform:scaleX(0.3812)></span></div>
        <section class=portal aria-label=刘猫猫主页过渡窗口>
            <div class=browser-bar aria-hidden=true>
                <span class=browser-dot></span><span class=browser-dot></span><span class=browser-dot></span>
                <span class=address>我是刘猫猫</span>
            </div>
            <div class=destination-surface>
                <h1 class=neu-name>刘猫猫</h1>
                <p class=neu-english>Cat Cat Liu</p>
            </div>
        </section>
        <button class="replay sf-hidden" id=replay type=button hidden>重播动画 ↻</button>
        <p class=sr-only role=status>图片加载完成后展示两秒，随后自动前往刘猫猫主页官方网站。</p>
    </main>
    <script>
        const cardElements = document.querySelectorAll('.card');
        cardElements.forEach(el => {
            el.classList.remove('card');
        });
    </script>
</body>
