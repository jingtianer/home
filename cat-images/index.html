<!DOCTYPE html>
<html lang=zh-CN>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<meta name=theme-color content=#f7f7f3>
<head>
<title>刘猫猫主页</title>
<meta name=referrer content=no-referrer>
<link type=image/x-icon rel="shortcut icon" href=data:application/octet-stream;base64,>
<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <main class="page playing">
        <div class=gallery aria-label=刘猫猫馆藏图片层叠>
            <img class=echo
                src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="753" height="1000"><rect fill-opacity="0"/></svg>'
                alt aria-hidden=true
                style="background-blend-mode:normal!important;background-clip:content-box!important;background-position:50% 50%!important;background-color:rgba(0,0,0,0)!important;background-image:var(--sf-img-1)!important;background-size:cover!important;background-origin:content-box!important;background-repeat:no-repeat!important;background-attachment:scroll!important">
            <figure class="shot wave"><img src="./lmm/1.png" /></figure>
            <figure class="shot crystal"><img src="./lmm/2.jpg" /></figure>
            <figure class="shot starry"><img src="./lmm/3.jpg" /></figure>
            <figure class="shot portrait"><img src="./lmm/4.jpg" /></figure>
            <figure class="shot scream"><img src="./lmm/5.jpg" /></figure>
            <figure class="shot bust"><img src="./lmm/6.jpg" /></figure>
            <figure class="shot academy"><img src="./lmm/7.jpg" /></figure>
            <div class=glass aria-hidden=true></div>
        </div>
        <a class=entry href="https://jingtianer.github.io/home" aria-label=前往刘猫猫主页>前往刘猫猫主页<span class=arrow aria-hidden=true>→</span></a>
        <div class=progress aria-hidden=true><span id=progress style=transform:scaleX(0.3812)></span></div>
        <section class=portal aria-label=刘猫猫主页过渡窗口>
            <div class=browser-bar aria-hidden=true>
                <span class=browser-dot></span><span class=browser-dot></span><span class=browser-dot></span>
                <span class=address>我是刘猫猫</span>
            </div>
            <div class=destination-surface>
                <h1 class=neu-name>刘猫猫</h1>
                <p class=neu-english>Cat Cat Liu</p>
                <div class=neu-loading aria-hidden=true></div>
            </div>
        </section>
        <button class="replay sf-hidden" id=replay type=button hidden>重播动画 ↻</button>
        <p class=sr-only role=status>图片加载完成后展示两秒，随后自动前往刘猫猫主页官方网站。</p>
    </main>
    <link rel="stylesheet" type="text/css" href="./css/bgMusicPlayer.css" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
    <script type="text/javascript" src="./js/bgMusicPlayer.js"></script>
</body>
